<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Outer Shield Outline with glow -->
  <path d="M256 70 L390 120 V250 C390 340 330 410 256 442 C182 410 122 340 122 250 V120 Z" 
        fill="#10b981" fill-opacity="0.08" stroke="url(#primary)" stroke-width="12" stroke-linejoin="round" />

  <!-- Dumbbell Icon Center -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Center Bar -->
    <rect x="180" y="244" width="152" height="24" rx="12" fill="#f4f4f5" />
    <rect x="236" y="240" width="40" height="32" rx="6" fill="#10b981" />

    <!-- Inner Collars -->
    <rect x="170" y="226" width="16" height="60" rx="6" fill="#71717a" />
    <rect x="326" y="226" width="16" height="60" rx="6" fill="#71717a" />

    <!-- Main Weight Plates Left -->
    <rect x="140" y="206" width="22" height="100" rx="8" fill="url(#primary)" />
    <rect x="110" y="220" width="22" height="72" rx="6" fill="#27272a" stroke="#10b981" stroke-width="3" />

    <!-- Main Weight Plates Right -->
    <rect x="350" y="206" width="22" height="100" rx="8" fill="url(#primary)" />
    <rect x="380" y="220" width="22" height="72" rx="6" fill="#27272a" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Energy Pulse Dot -->
  <circle cx="256" cy="115" r="8" fill="#10b981" filter="url(#glow)" />
</svg>
